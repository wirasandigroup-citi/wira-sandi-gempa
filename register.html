<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Peserta — Wira Sandi Gempa Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1a1a18;--ink2:#2e2e2b;--ink3:#5a5a55;--ink4:#8a8a82;--surf:#fff;--bg:#e8e8e5;--edge:#d8d8d2;--edge2:#c5c5bd;--red:#d42b2b;--red-l:#fbe5e5;--green:#2f8f4e;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--sans);color:var(--ink);padding:20px;}
  .card{width:100%;max-width:400px;background:var(--surf);border:1px solid var(--edge);border-radius:4px;padding:32px 28px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-mk{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:800;font-size:10px;}
  .brand-t{font-weight:800;font-size:15px;letter-spacing:.3px;}
  .sub{font-size:11px;color:var(--ink4);margin-bottom:20px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;}
  .info{font-size:11.5px;color:var(--ink3);background:var(--bg);border-left:3px solid var(--red);padding:9px 11px;margin-bottom:6px;line-height:1.5;}
  label{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.4px;}
  input{width:100%;padding:10px 11px;border:1px solid var(--edge2);border-radius:2px;font-family:var(--sans);font-size:13px;background:var(--bg);color:var(--ink);}
  input:focus{outline:none;border-color:var(--red);background:var(--surf);}
  small{display:block;font-size:10px;color:var(--ink4);margin-top:3px;}
  button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:2px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;letter-spacing:.3px;cursor:pointer;}
  button:hover{background:var(--red);}
  button:disabled{opacity:.6;cursor:default;}
  .msg{margin-top:14px;font-size:12px;padding:9px 11px;border-radius:2px;display:none;line-height:1.5;}
  .msg.err{background:var(--red-l);color:var(--red);display:block;}
  .msg.ok{background:#e5f5ea;color:var(--green);display:block;}
  .foot{margin-top:20px;text-align:center;font-size:12px;color:var(--ink4);}
  .foot a{color:var(--red);text-decoration:none;font-weight:600;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="brand-mk">WS</div><div class="brand-t">WIRA SANDI</div></div>
  <div class="sub">Gempa Bumi Monitoring · Daftar Peserta</div>
  <div class="info">Akun pertama yang mendaftar otomatis menjadi <strong>Admin</strong>. Pendaftaran berikutnya perlu disetujui admin sebelum bisa login.</div>
  <form id="regForm">
    <label>Nama Lengkap</label>
    <input type="text" name="name" required placeholder="Firman Irawan">
    <label>Email</label>
    <input type="email" name="email" required autocomplete="email" placeholder="nama@wirasandigroup.com">
    <label>Password</label>
    <input type="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Minimal 8 karakter">
    <small>Gunakan password yang kuat — kombinasi huruf, angka, simbol.</small>
    <button type="submit" id="regBtn">Daftar</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="foot">Sudah punya akun? <a href="/login.html">Masuk di sini</a></div>
</div>
<script>
const form = document.getElementById('regForm');
const msg = document.getElementById('msg');
const btn = document.getElementById('regBtn');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Memproses…';
  const fd = new FormData(form);
  try{
    const res = await fetch('/api/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name: fd.get('name'), email: fd.get('email'), password: fd.get('password') })
    });
    const data = await res.json();
    if(!res.ok){ msg.className='msg err'; msg.textContent = data.error || 'Pendaftaran gagal'; btn.disabled=false; btn.textContent='Daftar'; return; }
    msg.className='msg ok'; msg.textContent = data.message + ' Mengalihkan ke halaman login…';
    setTimeout(()=>location.href = '/login.html', 1200);
  }catch(err){
    msg.className='msg err'; msg.textContent='Terjadi kesalahan jaringan';
    btn.disabled=false; btn.textContent='Daftar';
  }
});
</script>
</body>
</html>
